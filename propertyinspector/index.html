<!DOCTYPE html>
<html>

<head>

    <meta charset="utf-8">

    <title>Device Volume</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="group">

        <label for="device">
            Output Device
        </label>

        <select id="device">
        </select>

    </div>

    <div class="group">

        <label for="mode">
            Mode
        </label>

        <select id="mode">

            <option value="up">
                Volume Up
            </option>

            <option value="down">
                Volume Down
            </option>

        </select>

    </div>

    <script src="inspector.js"></script>

</body>

</html>
